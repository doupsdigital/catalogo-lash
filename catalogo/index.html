<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Catálogo Digital Oficial — LashMenu</title>
  <meta name="description" content="Catálogo digital exclusivo e personalizado para agendamento de procedimentos.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <!-- Fontes Google para todos os modelos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Jost:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilo dinâmico que será trocado conforme o modelo do pedido -->
  <link id="theme-stylesheet" rel="stylesheet" href="../glamour-midnight/css/style.css">

  <style>
    /* ── Loader de Alta Classe Durante a Busca no Supabase ── */
    #catalog-loader {
      position: fixed;
      inset: 0;
      background: #0d0b0a;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #catalog-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-brand {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.2rem;
      color: #fff;
      letter-spacing: 0.15em;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .loader-brand em {
      font-style: italic;
      color: #e5a9b8;
    }
    .loader-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(229, 169, 184, 0.2);
      border-top-color: #e5a9b8;
      border-radius: 50%;
      animation: loaderSpin 0.8s linear infinite;
    }
    @keyframes loaderSpin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      color: #9c8e85;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.82rem;
      margin-top: 16px;
      letter-spacing: 0.05em;
    }

    /* ── Tela de Erro / Não Encontrado ── */
    #catalog-error {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0b0a;
      z-index: 99998;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    #catalog-error.is-active {
      display: flex;
      flex-direction: column;
    }
    #catalog-error h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      color: #e5a9b8;
      margin-bottom: 12px;
    }
    #catalog-error p {
      color: #a8988e;
      max-width: 420px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    #catalog-error a {
      display: inline-block;
      padding: 12px 28px;
      background: #e5a9b8;
      color: #0d0b0a;
      border-radius: 100px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
    }
  </style>
</head>

<body>

  <!-- LOADER INICIAL -->
  <div id="catalog-loader">
    <div class="loader-brand">Lash<em>Menu</em></div>
    <div class="loader-spinner"></div>
    <p class="loader-text">Carregando catálogo exclusivo...</p>
  </div>

  <!-- TELA DE ERRO (CASO NÃO EXISTA O SUBDOMÍNIO) -->
  <div id="catalog-error">
    <h2>Catálogo Não Encontrado</h2>
    <p>O link acessado não possui um catálogo cadastrado ou está em processo de finalização.</p>
    <a href="../vendas/form/">Criar Meu Catálogo</a>
  </div>

  <!-- CONTAINER DINÂMICO QUE RECEBERÁ O TEMPLATE RENDERIZADO -->
  <main id="catalog-app"></main>

  <!-- SUPABASE SDK & ENGINE DE RENDERIZAÇÃO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../vendas/form/js/supabase-config.js?v=3.0"></script>
  <script src="js/app.js?v=1.0"></script>
</body>

</html>
